run-name: Deploy to democracy production by @${{ github.actor }}

on:
  workflow_dispatch:
# GITHUB SECRETS AND VARIABLES LIMIT (100 EACH PER REPOSITORY)
# This repository has reached both the 100-secret and the 100-variable cap, so
# no non-credential setting may be added to Settings > Secrets and variables.
# Every non-credential value required by this workflow is therefore declared in
# the workflow-level ENV block below and referenced as ${{ env.NAME }}.
#
# THE ONLY SECRET IS: DEMOCRACY_AWS_PRODUCTION_ROLE_ARN
# AWS access keys are NOT used. Authentication is OIDC role federation, which
# requires the `id-token: write` permission declared further down.
#
# THE VALUES BELLOW ARE NOT CONFIDENTIAL: account ids, region, cluster,
# repository, service and container names. Do not add credentials here.
#
# SYNC REQUIREMENT: the image tags MUST stay `web` and `streaming`, because the
# terraform stack (patchwork-hub-iac) pins
# democracybookclub-production:web and democracybookclub-production:streaming.
# Any other tag will be reverted by the next terraform plan.
env:
  WEB_DEFINITION: .task/democracy_web_production.json
  SIDEKIQ_DEFINITION: .task/democracy_sidekiq_production.json
  STREAMING_DEFINITION: .task/democracy_streaming_production.json
  AWS_REGION: eu-west-2
  REGISTRY: eu-west-2.amazonaws.com
  DEMOCRACY_PRODUCTION_REPOSITORY: democracybookclub-production
  DEMOCRACY_CLUSTER_PRODUCTION: democracybookclub-production
  DEMOCRACY_WEB_PRODUCTION_SERVICE_NAME: democracybookclub-web-production
  DEMOCRACY_SIDEKIQ_PRODUCTION_SERVICE_NAME: democracybookclub-sidekiq-production
  DEMOCRACY_STREAMING_PRODUCTION_SERVICE_NAME: democracybookclub-streaming-production
  DEMOCRACY_WEB_PRODUCTION_CONTAINER: web
  DEMOCRACY_SIDEKIQ_PRODUCTION_CONTAINER_NAME: sidekiq
  DEMOCRACY_STREAMING_PRODUCTION_CONTAINER_NAME: streaming
  DEMOCRACY_PRODUCTION_IMAGE_TAG: web
  DEMOCRACY_STREAMING_PRODUCTION_IMAGE_TAG: streaming

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup and Cache Dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-deps.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare --activate

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/unplugged
            .yarn/build-state.yml
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache Ruby dependencies
        uses: actions/cache@v4
        id: cache-gems
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Cache Node dependencies
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            node_modules
            streaming/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/yarn.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          echo "Installing dependencies with Yarn..."
          yarn --version
          yarn install

  build-web:
    name: Build Web Application
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEMOCRACY_AWS_PRODUCTION_ROLE_ARN }}
          role-session-name: democracy-book-club-production-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-web-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-web-
            ${{ runner.os }}-buildx-

      - name: Build and push web image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.DEMOCRACY_PRODUCTION_REPOSITORY }}
          IMAGE_TAG: ${{ env.DEMOCRACY_PRODUCTION_IMAGE_TAG }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          echo "Building web application image..."
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --build-arg SOURCE_COMMIT="${SOURCE_COMMIT}" \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --push \
            .

          # Move cache to prevent growth
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

          echo "Successfully built and pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  build-streaming:
    name: Build Streaming Service
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEMOCRACY_AWS_PRODUCTION_ROLE_ARN }}
          role-session-name: democracy-book-club-production-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers for streaming
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-streaming
          key: ${{ runner.os }}-buildx-streaming-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-streaming-
            ${{ runner.os }}-buildx-

      - name: Build and push streaming image
        id: build-streaming-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.DEMOCRACY_PRODUCTION_REPOSITORY }}
          IMAGE_TAG: ${{ env.DEMOCRACY_STREAMING_PRODUCTION_IMAGE_TAG }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          echo "Building streaming service image..."
          docker buildx build \
            --platform linux/amd64 \
            --file ./streaming/Dockerfile \
            --cache-from type=local,src=/tmp/.buildx-cache-streaming \
            --cache-to type=local,dest=/tmp/.buildx-cache-streaming-new,mode=max \
            --build-arg SOURCE_COMMIT="${SOURCE_COMMIT}" \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --push \
            .

          # Move cache to prevent growth
          rm -rf /tmp/.buildx-cache-streaming
          mv /tmp/.buildx-cache-streaming-new /tmp/.buildx-cache-streaming

          echo "Successfully built and pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  deploy-production:
    name: Deploy Web, Sidekiq and Streaming to Democracy-Book-Club ECS Production
    runs-on: ubuntu-latest
    needs: [build-web, build-streaming]
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEMOCRACY_AWS_PRODUCTION_ROLE_ARN }}
          role-session-name: democracy-book-club-production-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Update web service task definition
        id: task-def-web
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.WEB_DEFINITION }}
          container-name: ${{ env.DEMOCRACY_WEB_PRODUCTION_CONTAINER }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.DEMOCRACY_PRODUCTION_REPOSITORY }}:${{ env.DEMOCRACY_PRODUCTION_IMAGE_TAG }}

      - name: Deploy web service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-web.outputs.task-definition }}
          service: ${{ env.DEMOCRACY_WEB_PRODUCTION_SERVICE_NAME }}
          cluster: ${{ env.DEMOCRACY_CLUSTER_PRODUCTION }}
          wait-for-service-stability: false

      - name: Update Sidekiq task definition
        id: task-def-sidekiq
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.SIDEKIQ_DEFINITION }}
          container-name: ${{ env.DEMOCRACY_SIDEKIQ_PRODUCTION_CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.DEMOCRACY_PRODUCTION_REPOSITORY }}:${{ env.DEMOCRACY_PRODUCTION_IMAGE_TAG }}

      - name: Deploy Sidekiq service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-sidekiq.outputs.task-definition }}
          service: ${{ env.DEMOCRACY_SIDEKIQ_PRODUCTION_SERVICE_NAME }}
          cluster: ${{ env.DEMOCRACY_CLUSTER_PRODUCTION }}
          wait-for-service-stability: false

      - name: Update Streaming task definition
        id: task-def-streaming
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.STREAMING_DEFINITION }}
          container-name: ${{ env.DEMOCRACY_STREAMING_PRODUCTION_CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.DEMOCRACY_PRODUCTION_REPOSITORY }}:${{ env.DEMOCRACY_STREAMING_PRODUCTION_IMAGE_TAG }}

      - name: Deploy Streaming service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-streaming.outputs.task-definition }}
          service: ${{ env.DEMOCRACY_STREAMING_PRODUCTION_SERVICE_NAME }}
          cluster: ${{ env.DEMOCRACY_CLUSTER_PRODUCTION }}
          wait-for-service-stability: false

      - name: Deployment complete
        run: |
          echo "Deployment to production environment completed successfully!"
          echo "Web service: ${{ env.DEMOCRACY_WEB_PRODUCTION_SERVICE_NAME }}"
          echo "Sidekiq service: ${{ env.DEMOCRACY_SIDEKIQ_PRODUCTION_SERVICE_NAME }}"
          echo "Streaming service: ${{ env.DEMOCRACY_STREAMING_PRODUCTION_SERVICE_NAME }}"
          echo "Cluster: ${{ env.DEMOCRACY_CLUSTER_PRODUCTION }}"
