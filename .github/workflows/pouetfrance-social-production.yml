run-name: Deploy to pouetfrance social production by @${{ github.actor }}

on:
  workflow_dispatch:
  push:
    branches:
      - pouetfrance-social-production-4.6.5

# GITHUB SECRETS AND VARIABLES LIMIT (100 EACH PER REPOSITORY)
# This repository has reached both the 100-secret and the 100-variable cap, so
# no non-credential setting may be added to Settings > Secrets and variables.
# Every non-credential value required by this workflow is therefore declared in
# the workflow-level ENV block below and referenced as ${{ env.NAME }}.
#
# THE ONLY SECRET IS: MASTODON_AWS_ROLE_ARN
# AWS access keys are NOT used. Authentication is OIDC role federation, which
# requires the `id-token: write` permission declared further down.
#
# THE VALUES BELOW ARE NOT CONFIDENTIAL: account ids, region, cluster,
# repository, service and container names. Do not add credentials here.
#
# IMAGE TAGS ARE PER COMMIT: `web-<github.sha>` and `streaming-<github.sha>`.
# Every deploy therefore produces an immutable tag, so a task definition revision
# identifies exactly one image and can be rolled back to. The mutable `web` and
# `streaming` aliases are NOT used: ECS resolves an image tag to a digest when a
# task STARTS, so a shared alias would mean two revisions with the same string
# resolve to different digests, and a restarted task would silently pick up a
# newer image. Rollback would be impossible.
#
# The terraform stack (patchwork-hub-iac) still lists `:web`/`:streaming` in its
# `image` variable, but that value only applies when a task definition family is
# first created. `modules/ecs/task_definition` carries
# `lifecycle { ignore_changes = [container_definitions] }` precisely so the
# pipeline owns the image and terraform does not revert it. The ECR repository
# keeps a 30-image lifecycle policy, which is 30 deploys of history.
env:
  AWS_REGION: eu-west-2
  REGISTRY: eu-west-2.amazonaws.com
  POUETFRANCE_SOCIAL_PRODUCTION_REPOSITORY: pouetfrance-social-production
  POUETFRANCE_SOCIAL_PRODUCTION_CLUSTER: pouetfrance-social-production
  POUETFRANCE_SOCIAL_PRODUCTION_WEB_SERVICE_NAME: pouetfrance-social-web-production
  POUETFRANCE_SOCIAL_PRODUCTION_SIDEKIQ_SERVICE_NAME: pouetfrance-social-sidekiq-production
  POUETFRANCE_SOCIAL_PRODUCTION_STREAMING_SERVICE_NAME: pouetfrance-social-streaming-production
  POUETFRANCE_SOCIAL_PRODUCTION_WEB_CONTAINER: web
  POUETFRANCE_SOCIAL_PRODUCTION_SIDEKIQ_CONTAINER_NAME: sidekiq
  POUETFRANCE_SOCIAL_PRODUCTION_STREAMING_CONTAINER_NAME: streaming
  POUETFRANCE_SOCIAL_PRODUCTION_IMAGE_TAG: web-${{ github.sha }}
  POUETFRANCE_SOCIAL_PRODUCTION_STREAMING_IMAGE_TAG: streaming-${{ github.sha }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup and Cache Dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-deps.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare --activate

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/unplugged
            .yarn/build-state.yml
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache Ruby dependencies
        uses: actions/cache@v4
        id: cache-gems
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Cache Node dependencies
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            node_modules
            streaming/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/yarn.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          echo "Installing dependencies with Yarn..."
          yarn --version
          yarn install

  build-web:
    name: Build Web Application
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.MASTODON_AWS_ROLE_ARN }}
          role-session-name: pouetfrance-social-production-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-web-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-web-
            ${{ runner.os }}-buildx-

      - name: Build and push web image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.POUETFRANCE_SOCIAL_PRODUCTION_REPOSITORY }}
          IMAGE_TAG: ${{ env.POUETFRANCE_SOCIAL_PRODUCTION_IMAGE_TAG }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          echo "Building web application image..."
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --build-arg SOURCE_COMMIT="${SOURCE_COMMIT}" \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --push \
            .

          # Move cache to prevent growth
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

          echo "Successfully built and pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  build-streaming:
    name: Build Streaming Service
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.MASTODON_AWS_ROLE_ARN }}
          role-session-name: pouetfrance-social-production-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers for streaming
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-streaming
          key: ${{ runner.os }}-buildx-streaming-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-streaming-
            ${{ runner.os }}-buildx-

      - name: Build and push streaming image
        id: build-streaming-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.POUETFRANCE_SOCIAL_PRODUCTION_REPOSITORY }}
          IMAGE_TAG: ${{ env.POUETFRANCE_SOCIAL_PRODUCTION_STREAMING_IMAGE_TAG }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          echo "Building streaming service image..."
          docker buildx build \
            --platform linux/amd64 \
            --file ./streaming/Dockerfile \
            --cache-from type=local,src=/tmp/.buildx-cache-streaming \
            --cache-to type=local,dest=/tmp/.buildx-cache-streaming-new,mode=max \
            --build-arg SOURCE_COMMIT="${SOURCE_COMMIT}" \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --push \
            .

          # Move cache to prevent growth
          rm -rf /tmp/.buildx-cache-streaming
          mv /tmp/.buildx-cache-streaming-new /tmp/.buildx-cache-streaming

          echo "Successfully built and pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  deploy-production:
    name: Deploy Web, Sidekiq and Streaming to Pouetfrance-Social ECS Production
    runs-on: ubuntu-latest
    needs: [build-web, build-streaming]
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.MASTODON_AWS_ROLE_ARN }}
          role-session-name: pouetfrance-social-production-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      # The task definition is resolved THROUGH the service, so the service must
      # already exist. Terraform remains the only writer of CPU, memory, ports,
      # IAM roles, log groups and environment files; this pipeline only replaces
      # the image. Nothing about the task definitions is stored in this
      # repository, so it cannot drift from the terraform stack.
      - name: Download current web task definition
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$POUETFRANCE_SOCIAL_PRODUCTION_CLUSTER" \
            --services "$POUETFRANCE_SOCIAL_PRODUCTION_WEB_SERVICE_NAME" \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "Web service is currently on: $TASK_DEF_ARN"
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition' \
            --output json > task-definition-web.json

      - name: Render web task definition with this commit image
        id: task-def-web
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-web.json
          container-name: ${{ env.POUETFRANCE_SOCIAL_PRODUCTION_WEB_CONTAINER }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.POUETFRANCE_SOCIAL_PRODUCTION_REPOSITORY }}:${{ env.POUETFRANCE_SOCIAL_PRODUCTION_IMAGE_TAG }}

      - name: Deploy web service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-web.outputs.task-definition }}
          service: ${{ env.POUETFRANCE_SOCIAL_PRODUCTION_WEB_SERVICE_NAME }}
          cluster: ${{ env.POUETFRANCE_SOCIAL_PRODUCTION_CLUSTER }}
          wait-for-service-stability: false

      - name: Download current Sidekiq task definition
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$POUETFRANCE_SOCIAL_PRODUCTION_CLUSTER" \
            --services "$POUETFRANCE_SOCIAL_PRODUCTION_SIDEKIQ_SERVICE_NAME" \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "Sidekiq service is currently on: $TASK_DEF_ARN"
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition' \
            --output json > task-definition-sidekiq.json

      - name: Render Sidekiq task definition with this commit image
        id: task-def-sidekiq
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-sidekiq.json
          container-name: ${{ env.POUETFRANCE_SOCIAL_PRODUCTION_SIDEKIQ_CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.POUETFRANCE_SOCIAL_PRODUCTION_REPOSITORY }}:${{ env.POUETFRANCE_SOCIAL_PRODUCTION_IMAGE_TAG }}

      - name: Deploy Sidekiq service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-sidekiq.outputs.task-definition }}
          service: ${{ env.POUETFRANCE_SOCIAL_PRODUCTION_SIDEKIQ_SERVICE_NAME }}
          cluster: ${{ env.POUETFRANCE_SOCIAL_PRODUCTION_CLUSTER }}
          wait-for-service-stability: false

      - name: Download current Streaming task definition
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$POUETFRANCE_SOCIAL_PRODUCTION_CLUSTER" \
            --services "$POUETFRANCE_SOCIAL_PRODUCTION_STREAMING_SERVICE_NAME" \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "Streaming service is currently on: $TASK_DEF_ARN"
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition' \
            --output json > task-definition-streaming.json

      - name: Render Streaming task definition with this commit image
        id: task-def-streaming
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-streaming.json
          container-name: ${{ env.POUETFRANCE_SOCIAL_PRODUCTION_STREAMING_CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.POUETFRANCE_SOCIAL_PRODUCTION_REPOSITORY }}:${{ env.POUETFRANCE_SOCIAL_PRODUCTION_STREAMING_IMAGE_TAG }}

      - name: Deploy Streaming service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-streaming.outputs.task-definition }}
          service: ${{ env.POUETFRANCE_SOCIAL_PRODUCTION_STREAMING_SERVICE_NAME }}
          cluster: ${{ env.POUETFRANCE_SOCIAL_PRODUCTION_CLUSTER }}
          wait-for-service-stability: false

      - name: Deployment complete
        run: |
          echo "Deployment to production environment completed successfully!"
          echo "Commit: ${{ github.sha }}"
          echo "Web image: ${{ env.POUETFRANCE_SOCIAL_PRODUCTION_REPOSITORY }}:${{ env.POUETFRANCE_SOCIAL_PRODUCTION_IMAGE_TAG }}"
          echo "Streaming image: ${{ env.POUETFRANCE_SOCIAL_PRODUCTION_REPOSITORY }}:${{ env.POUETFRANCE_SOCIAL_PRODUCTION_STREAMING_IMAGE_TAG }}"
          echo "Web service: ${{ env.POUETFRANCE_SOCIAL_PRODUCTION_WEB_SERVICE_NAME }}"
          echo "Sidekiq service: ${{ env.POUETFRANCE_SOCIAL_PRODUCTION_SIDEKIQ_SERVICE_NAME }}"
          echo "Streaming service: ${{ env.POUETFRANCE_SOCIAL_PRODUCTION_STREAMING_SERVICE_NAME }}"
          echo "Cluster: ${{ env.POUETFRANCE_SOCIAL_PRODUCTION_CLUSTER }}"
