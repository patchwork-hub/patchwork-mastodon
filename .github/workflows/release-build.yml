name: Release build
run-name: Build ${{ github.ref_name }} images by @${{ github.actor }}

# Builds the web and streaming images ONCE per release and pushes them to the
# shared Harbor project (deploy/projects/_defaults.yml -> image). Every project
# deploys these same images; nothing is built per project.
#
#   git tag v4.6.5-pw.2 && git push origin v4.6.5-pw.2   -> images tagged v4.6.5-pw.2
#   "Run workflow" on any branch                         -> images tagged sha-<commit> (staging only)
#
# Secret: RELEASE_HARBOR_PASSWORD (push robot of the shared Harbor project).

on:
  push:
    tags:
      - 'v*.*.*-pw.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: web
            dockerfile: Dockerfile
          - component: streaming
            dockerfile: streaming/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Work out registry and tags
        id: meta
        run: |
          registry=$(yq -r '.image.registry' deploy/projects/_defaults.yml)
          project=$(yq -r '.image.harbor_project' deploy/projects/_defaults.yml)
          image="$registry/$project/${{ matrix.component }}"
          sha_tag="sha-${GITHUB_SHA::12}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags="$image:$GITHUB_REF_NAME,$image:$sha_tag"
          else
            tags="$image:$sha_tag"
          fi
          {
            echo "registry=$registry"
            echo "project=$project"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      - name: Login to shared Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.meta.outputs.registry }}
          username: robot$${{ steps.meta.outputs.project }}+release-push
          password: ${{ secrets.RELEASE_HARBOR_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.component }}"
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
