run-name: Deploy to brazillian-staging staging by @${{ github.actor }}

on:
  workflow_dispatch:
  push:
    branches:
      - brazilian-4.5.6-staging

env:
  AWS_REGION: ${{ vars.BRAZILIAN_STAGING_AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.BRAZILIAN_STAGING_AWS_ROLE_ARN }}
  SSM_PATH: ${{ vars.BRAZILIAN_STAGING_SSM_PATH }}
  WEB_DEFINITION: .task/brazilian_web_staging.json
  SIDEKIQ_DEFINITION: .task/brazilian_sidekiq_staging.json
  STREAMING_DEFINITION: .task/brazilian_streaming_staging.json

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup and Cache Dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-deps.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare --activate

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/unplugged
            .yarn/build-state.yml
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache Ruby dependencies
        uses: actions/cache@v4
        id: cache-gems
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Cache Node dependencies
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            node_modules
            streaming/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/yarn.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          echo "Installing dependencies with Yarn..."
          yarn --version
          yarn install

  config:
    name: Load configuration from SSM
    runs-on: ubuntu-latest
    outputs:
      web_repository: ${{ steps.load.outputs.web_repository }}
      streaming_repository: ${{ steps.load.outputs.streaming_repository }}
      web_container: ${{ steps.load.outputs.web_container }}
      sidekiq_container: ${{ steps.load.outputs.sidekiq_container }}
      streaming_container: ${{ steps.load.outputs.streaming_container }}
      web_service: ${{ steps.load.outputs.web_service }}
      sidekiq_service: ${{ steps.load.outputs.sidekiq_service }}
      streaming_service: ${{ steps.load.outputs.streaming_service }}
      cluster: ${{ steps.load.outputs.cluster }}
      web_image_tag: ${{ steps.load.outputs.web_image_tag }}
      streaming_image_tag: ${{ steps.load.outputs.streaming_image_tag }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load parameters from SSM Parameter Store
        id: load
        run: |
          set -euo pipefail
          aws ssm get-parameters-by-path \
            --path "${SSM_PATH}" \
            --with-decryption \
            --query 'Parameters[].[Name,Value]' \
            --output text \
          | while IFS=$'\t' read -r name value; do
              key="${name##*/}"
              echo "${key}=${value}" >> "$GITHUB_OUTPUT"
              echo "Loaded: ${key}"
            done

  build-web:
    name: Build Web Application
    runs-on: ubuntu-latest
    needs: [setup, config]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-web-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-web-
            ${{ runner.os }}-buildx-

      - name: Build and push web image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ needs.config.outputs.web_repository }}
          IMAGE_TAG: ${{ needs.config.outputs.web_image_tag }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          echo "Building web application image..."
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --build-arg SOURCE_COMMIT="${SOURCE_COMMIT}" \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --push \
            .

          # Move cache to prevent growth
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

          echo "Successfully built and pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  build-streaming:
    name: Build Streaming Service
    runs-on: ubuntu-latest
    needs: [setup, config]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers for streaming
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-streaming
          key: ${{ runner.os }}-buildx-streaming-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-streaming-
            ${{ runner.os }}-buildx-

      - name: Build and push streaming image
        id: build-streaming-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ needs.config.outputs.streaming_repository }}
          IMAGE_TAG: ${{ needs.config.outputs.streaming_image_tag }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          echo "Building streaming service image..."
          docker buildx build \
            --platform linux/amd64 \
            --file ./streaming/Dockerfile \
            --cache-from type=local,src=/tmp/.buildx-cache-streaming \
            --cache-to type=local,dest=/tmp/.buildx-cache-streaming-new,mode=max \
            --build-arg SOURCE_COMMIT="${SOURCE_COMMIT}" \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --push \
            .

          # Move cache to prevent growth
          rm -rf /tmp/.buildx-cache-streaming
          mv /tmp/.buildx-cache-streaming-new /tmp/.buildx-cache-streaming

          echo "Successfully built and pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [config, build-web, build-streaming]
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Update web service task definition
        id: task-def-web
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.WEB_DEFINITION }}
          container-name: ${{ needs.config.outputs.web_container }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ needs.config.outputs.web_repository }}:${{ needs.config.outputs.web_image_tag }}

      - name: Deploy web service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-web.outputs.task-definition }}
          service: ${{ needs.config.outputs.web_service }}
          cluster: ${{ needs.config.outputs.cluster }}
          wait-for-service-stability: false

      - name: Update Sidekiq task definition
        id: task-def-sidekiq
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.SIDEKIQ_DEFINITION }}
          container-name: ${{ needs.config.outputs.sidekiq_container }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ needs.config.outputs.web_repository }}:${{ needs.config.outputs.web_image_tag }}

      - name: Deploy Sidekiq service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-sidekiq.outputs.task-definition }}
          service: ${{ needs.config.outputs.sidekiq_service }}
          cluster: ${{ needs.config.outputs.cluster }}
          wait-for-service-stability: false

      - name: Update Streaming task definition
        id: task-def-streaming
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.STREAMING_DEFINITION }}
          container-name: ${{ needs.config.outputs.streaming_container }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ needs.config.outputs.streaming_repository }}:${{ needs.config.outputs.streaming_image_tag }}

      - name: Deploy Streaming service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-streaming.outputs.task-definition }}
          service: ${{ needs.config.outputs.streaming_service }}
          cluster: ${{ needs.config.outputs.cluster }}
          wait-for-service-stability: false

      - name: Deployment complete
        run: |
          echo "Deployment to staging environment completed successfully!"
          echo "Web service: ${{ needs.config.outputs.web_service }}"
          echo "Sidekiq service: ${{ needs.config.outputs.sidekiq_service }}"
          echo "Streaming service: ${{ needs.config.outputs.streaming_service }}"
          echo "Cluster: ${{ needs.config.outputs.cluster }}"