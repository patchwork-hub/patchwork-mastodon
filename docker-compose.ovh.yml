# OVH Public Cloud deployment compose file
# Images are built and pushed by .github/workflows/build-push-ovh-harbor.yml
# which updates the image lines below on every push.

services:
  web:
    # TAGS ARE UPDATED BY CI — do not edit manually
    image: d3r5hv0f.eu-west-par.container-registry.ovh.net/pouetsocialmastodon/web:web-ee10d3ba588cfe87a34d5b96ebd4511c15ee83fb
    restart: unless-stopped
    # Matches AWS ECS task definition: 1024 CPU units / 2048 MB memory
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 2G
    env_file:
      - /home/ubuntu/deployment/credential/.env.production
    command: >
      bash -c "bundle exec rails db:create &&
               bundle exec rails db:migrate &&
               bundle exec rails s -p 3000"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - external_network
      - internal_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    working_dir: /opt/mastodon
    volumes:
      - mastodon_uploads:/opt/mastodon/public/system
      - /home/ubuntu/deployment/credential/firebase/firebase.json:/opt/mastodon/config/firebase-adminsdk.json:ro
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
      memlock:
        soft: 64
        hard: 64
      msgqueue:
        soft: 819200
        hard: 819200
      nproc:
        soft: 15471
        hard: 15471
      sigpending:
        soft: 15471
        hard: 15471

  streaming:
    # TAGS ARE UPDATED BY CI — do not edit manually
    image: d3r5hv0f.eu-west-par.container-registry.ovh.net/pouetsocialmastodon/streaming:streaming-ee10d3ba588cfe87a34d5b96ebd4511c15ee83fb
    restart: unless-stopped
    # Matches AWS ECS task definition: 256 CPU units / 512 MB memory
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 512M
    env_file:
      - /home/ubuntu/deployment/credential/.env.production
    environment:
      - DB_SSLMODE=no-verify
    command: ["node", "./streaming/index.js"]
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - external_network
      - internal_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/api/v1/streaming/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    working_dir: /opt/mastodon

  sidekiq:
    # TAGS ARE UPDATED BY CI — do not edit manually
    image: d3r5hv0f.eu-west-par.container-registry.ovh.net/pouetsocialmastodon/web:web-ee10d3ba588cfe87a34d5b96ebd4511c15ee83fb
    restart: unless-stopped
    # Matches AWS ECS task definition: 512 CPU units / 1024 MB memory, 1 replica.
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 1G
    env_file:
      - /home/ubuntu/deployment/credential/.env.production
    command: >
      bash -c "bundle exec sidekiq"
    networks:
      - internal_network
      - external_network
    working_dir: /opt/mastodon
    volumes:
      - mastodon_uploads:/opt/mastodon/public/system
      - /home/ubuntu/deployment/credential/firebase/firebase.json:/opt/mastodon/config/firebase-adminsdk.json:ro
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
      memlock:
        soft: 64
        hard: 64
      msgqueue:
        soft: 819200
        hard: 819200
      nproc:
        soft: 15471
        hard: 15471
      sigpending:
        soft: 15471
        hard: 15471

volumes:
  mastodon_uploads:

networks:
  external_network:
  internal_network:
    external: true
    name: pouetsocial_internal
